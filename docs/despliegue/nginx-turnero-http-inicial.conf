# PASO PREVIO: sirve solo el puerto 80 para que Let's Encrypt (certbot) pueda verificar el dominio
# y emitir el certificado. Cuando el certificado exista, se reemplaza por nginx-turnero.conf.
# Instalar como: /etc/nginx/conf.d/turnero.conf
# Reemplazar DOMINIO-A-DEFINIR por el dominio real (ver la guía, paso 8).

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO-A-DEFINIR;

    # carpeta donde certbot deja el archivo de verificación
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Turnero: configurando el certificado HTTPS.\n";
        add_header Content-Type text/plain;
    }
}
