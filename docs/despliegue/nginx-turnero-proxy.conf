# Datos que nginx le pasa a la API (se incluye desde nginx-turnero.conf).
# Instalar como: /etc/nginx/snippets/turnero-proxy.conf

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# OJO: se usa $remote_addr (la IP real de quien se conecta) y NO $proxy_add_x_forwarded_for:
# así nadie puede mandar un X-Forwarded-For inventado para falsear su IP ante los límites de
# intentos y la auditoría. La API lo lee porque en su .env está TRUST_PROXY=1.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# La API ya manda sus propias cabeceras de seguridad (helmet) y nginx manda las suyas en el
# server: se quitan las de la API para que no salgan repetidas.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
