# Turnero: configuración de nginx para producción (HTTPS, API, llamador y web).
# Instalar como: /etc/nginx/conf.d/turnero.conf   (reemplaza al archivo "http-inicial")
# Antes de usarlo: reemplazar DOMINIO-A-DEFINIR por el dominio real (ver la guía, paso 8).
# Probar SIEMPRE con:   sudo nginx -t     y aplicar con:   sudo systemctl reload nginx
# Este archivo necesita además /etc/nginx/snippets/turnero-proxy.conf (nginx-turnero-proxy.conf).

# ---------------------------------------------------------------- puerto 80: todo pasa a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO-A-DEFINIR;

    # lo único que se sirve por HTTP: la verificación y renovación del certificado
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- puerto 443: el sitio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO-A-DEFINIR;

    server_tokens off;

    # Certificado de Let's Encrypt (la carpeta lleva el nombre del primer dominio que se pidió a certbot)
    ssl_certificate     /etc/letsencrypt/live/DOMINIO-A-DEFINIR/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO-A-DEFINIR/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:turnero_ssl:10m;
    ssl_session_tickets off;

    # Cabeceras de seguridad de TODO el sitio. HSTS: obliga al navegador a usar siempre HTTPS.
    # Mientras se prueba, bajar max-age a 300 (5 minutos) y subirlo a 31536000 (1 año) cuando todo ande.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors no se puede poner en el <meta> de la web: va acá (evita que otro sitio la meta en un marco)
    add_header Content-Security-Policy   "frame-ancestors 'self'" always;

    # Tamaño máximo de un pedido. Todos los pedidos de la API son chicos (el límite de JSON de la API es 100 kB);
    # la única excepción es la foto de perfil (la API acepta hasta 5 MB), que tiene su propio límite más abajo.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # La web (HTML, JS, CSS) es lo que genera "npm run build" en Frontend/dist, copiado acá:
    root /var/www/turnero;
    index index.html;

    # ------------------------------------------------------------ API
    # Foto de perfil: hasta 5 MB (límite de la API) + margen del formulario.
    location = /api/auth/foto {
        client_max_body_size 6m;
        include /etc/nginx/snippets/turnero-proxy.conf;
        proxy_pass http://127.0.0.1:3006;
    }

    # Conexiones que quedan abiertas (pantalla del llamador y paneles en tiempo real): sin buffer,
    # y con un tiempo de espera largo. La API manda un "ping" periódico para que no se corten.
    location ~ ^/api/(display/stream|doctor/agenda/stream|admin/agenda/stream)$ {
        include /etc/nginx/snippets/turnero-proxy.conf;
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        include /etc/nginx/snippets/turnero-proxy.conf;
        proxy_pass http://127.0.0.1:3006;
        proxy_read_timeout 60s;
    }

    # Fotos de perfil: la API las sirve en /uploads (sin el prefijo /api)
    location /uploads/ {
        include /etc/nginx/snippets/turnero-proxy.conf;
        proxy_pass http://127.0.0.1:3006;
        expires 1d;
    }

    # ------------------------------------------------------------ la web
    # Archivos ocultos (.env, .git, etc.): nunca
    location ~ /\. {
        return 404;
    }

    # JS y CSS (el nombre cambia con cada versión): se pueden guardar un año
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Las pantallas que EXISTEN en la app devuelven index.html (la app dibuja la pantalla).
    # Si se agrega una ruta nueva en Frontend/src/App.tsx, hay que agregarla acá también.
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location ~ ^/(mi-turno|privacidad|login|reset-password|confirmar|pantalla|perfil|nuevo-usuario|logout)/?$ {
        expires -1;
        try_files /index.html =404;
    }
    location ~ ^/(admin|recepcion|medico|private)(/|$) {
        expires -1;
        try_files /index.html =404;
    }

    # Todo lo demás: el archivo si existe (robots.txt, sitemap.xml, favicon.svg, og-image.png...);
    # si no, un 404 REAL (código 404, no 200). Se muestra la página "Esta página no existe" de la app.
    location / {
        try_files $uri =404;
    }
    error_page 404 /index.html;
}
